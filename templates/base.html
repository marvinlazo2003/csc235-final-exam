<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Tornado Tracker{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<!-- NAVBAR (shared across all pages) -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand" href="{{ url_for('home') }}">
            Tornado Tracker
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('home') }}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('about') }}">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('tornadoes') }}">Tornado Data</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('stats') }}">Scary Facts about Tornadoes</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('ef_scale') }}">EF Scale Guide</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('tornado_formation') }}">How tornadoes form</a>
                </li>

            </ul>

        </div>
    </div>
</nav>

<!-- PAGE CONTENT -->
<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

<!-- FOOTER -->
<footer class="text-center mt-5 p-3 bg-dark text-white">
    Tornado Tracker © 2026
</footer>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
